<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>资产 · FANISL CONSOLE</title>
    <!-- 标签页图标：SVG 为主，Safari 等不认 SVG 图标的退回 PNG；iOS 加到主屏用 180px 那张。
         几何与报头里的标志同一份，见 src/components/BrandMark.tsx -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 主题必须在首帧之前定下来：写死一个初值会让选了浅色的人先看到一帧深色，
         而登录页没有报头（切换器在报头里），写死的那个值就再也纠正不回来了。 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('fanisl.console.theme')
          var dark = stored === 'dark' || (stored !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* 隐私模式下读不到 localStorage：跟着系统走，别拦住渲染 */
          if (matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark')
          }
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

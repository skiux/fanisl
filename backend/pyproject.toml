[project]
name = "analyzer"
version = "0.1.0"
description = "Claude-assisted crypto market analysis backend (conversational)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "ccxt>=4.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "yt-dlp>=2026.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # 行情层：prices/estimates 取美股与盈利预期。函数内 import，缺了它 collector 照常起，
    # 只有日维护跑到刷行情那步才失败，且被 daily.py 的 try/except 吞掉——静默停摆。
    "yfinance>=0.2.50",
    # knowledge/llm.py 与 prices.py 是模块级 import（Gemini 走 REST 不用 SDK，FRED 取 CSV）。
    # 此前只在 dev 组里，靠 anthropic 的传递依赖凑巧装上——显式声明，别把可用性寄托在别人的依赖表上。
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyzer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

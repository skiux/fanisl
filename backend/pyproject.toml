[project]
name = "analyzer"
version = "0.1.0"
description = "Claude-assisted crypto market analysis backend (conversational)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "ccxt>=4.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "yt-dlp>=2026.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyzer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

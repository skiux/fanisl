# fanisl 反向代理：nginx 提供前端静态 + 把 API 路径转发到 uvicorn(127.0.0.1:8000)
# 前端用 VITE_API_BASE='' 构建，浏览器同源请求 /trading /chat 等，由下面规则代理。
# 放到 /etc/nginx/sites-available/fanisl，再 ln -s 到 sites-enabled，nginx -t && reload。

server {
    listen 80;
    server_name fanisl.skiuo.com;  # 换成你的域名

    root /opt/fanisl/frontend/dist;
    index index.html;

    # API 路径（与 main.py 的顶层路由前缀一致）→ uvicorn
    # 标的工作台的前缀是**单数 asset**：Vite 的构建产物在 /assets/index-*.js，
    # 这里写成 assets 会把前端的 JS/CSS 一起代理到 uvicorn，页面白屏。
    #
    # **加新的顶层路由前缀时，这一行必须同步改**，否则请求会落到下面的 SPA 兜底、
    # 返回 index.html——前端拿到一坨 HTML 去 JSON.parse，报错还完全指不到这里。
    # deploy/check_nginx_routes.py 就是为这件事写的，改完跑一遍。
    location ~ ^/(health|chat|price|watchlist|metrics|catalysts|collection|conversations|trading|knowledge|research|asset|auth|admin|portfolio|orders|ledger)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;   # Claude 进场/扫描是同步长调用
        # SSE(/chat/stream)：关缓冲，逐字输出才即时
        proxy_buffering off;
        proxy_cache off;
    }

    # **不带斜杠的 /console 必须重定向。** `location /console/` 只匹配带斜杠的，
    # 不带斜杠会一路落到下面的 SPA 兜底、返回**知识引擎**的 index.html——
    # 于是输 fanisl.skiuo.com/console 进去的是另一个应用，登录、退出全在那边发生。
    # 2026-09-02 实测踩到；用 `location =` 精确匹配，代价是一次 301。
    location = /console {
        return 301 /console/;
    }

    # 控制台（资产台）：独立构建产物，挂在 /console/ 路径前缀下。
    # 同源是有意的——会话 cookie 因此不必跨站，省掉 SameSite=None 那套。
    # alias 与 location 都必须以 / 结尾，否则 try_files 会拼出错误路径。
    location /console/ {
        alias /opt/fanisl/console/dist/;
        try_files $uri $uri/ /console/index.html;
    }

    # 前端 SPA：其余都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
